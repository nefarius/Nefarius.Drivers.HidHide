name: Generate API Documentation

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .Net SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x

      - name: Install XMLDoc2Markdown
        run: dotnet tool install -g Nefarius.Tools.XMLDoc2Markdown

      - name: Build
        run: dotnet build ./src/${{ github.event.repository.name }}.csproj -c Release -f netstandard2.0 -p:SolutionDir=$(pwd)/

      - name: Clear stale docs
        run: rm -f ./docs/*.md

      - name: Generate API docs
        run: xmldoc2md ./bin/netstandard2.0/${{ github.event.repository.name }}.dll ./docs/

      - name: Check for changes
        id: check-for-changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --exit-code || git commit -m "Update API documentation"
  
      - name: Push changes
        if: success() && steps.check-for-changes.outcome == 'success'
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}